[project]
name = "fleet-management-backend"
version = "0.1.0"
description = "FastAPI backend for the fleet management GPS platform MVP."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2.0",
  "aiosqlite>=0.20,<1.0",
  "asyncpg>=0.29,<1.0",
  "bcrypt>=3.2,<4.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "paho-mqtt>=2.1,<3.0",
  "passlib[bcrypt]>=1.7,<2.0",
  "PyJWT>=2.9,<3.0",
  "pytest>=8.0,<9.0",
  "SQLAlchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
